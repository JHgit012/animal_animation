<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANIMAL MOTION STUDY - Interactive Web Poster</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main class="poster-container">
      <header class="poster-header">
        <h1 class="poster-title">ANIMAL MOTION STUDY</h1>
        <p class="poster-subtitle">An Exploration of Movement</p>
      </header>

      <div class="additional-text">INTERACTIVE WEB EXPERIMENT / 2026</div>

      <section class="graphic-stage">
        <div class="motion-wrapper" id="motionWrapper">
          <div class="frill-circle circle-left" id="circleLeft"></div>
          <div class="frill-circle circle-right" id="circleRight"></div>
          <div
            class="lizard-triangle"
            id="triangleTarget"
            title="클릭하여 목도리 반응 보기"
          ></div>
        </div>
      </section>

      <footer class="poster-footer">
        <div class="footer-col">
          <span class="meta-label">Description</span>
          <p class="poster-description">
            Exploring the rhythm, direction, and behavior of natural movement
            through geometric forms.
          </p>
        </div>

        <div class="footer-col">
          <span class="meta-label">Date & Time</span>
          <div class="meta-item">DEC 10, 2026</div>
          <div class="meta-item">10:00 AM – 06:00 PM</div>
        </div>

        <div class="footer-col">
          <span class="meta-label">Location & Organizer</span>
          <div class="meta-item">DIGITAL ART EXHIBITION</div>
          <div class="meta-item">MYONGJI UNIVERSITY</div>
        </div>
      </footer>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
